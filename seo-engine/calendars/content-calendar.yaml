# Calendario SEO — Vitaliah SAS (stevia.com.co)
#
# Fuente de datos unica del agente redactor (ver motorsinscripts.txt, Paso 1).
# Reemplaza a la hoja de Google Sheets "Vitaliah - Calendario SEO (Completo)",
# que dejo de ser la fuente activa el 2026-09-01: al vivir fuera del repo, el
# agente no tenia forma de escribir en ella (solo lectura via el conector de
# Drive), lo que la dejaba desincronizada de lo que en verdad existia en
# Shopify. Este YAML vive en el repo, así que el propio agente puede leerlo,
# editarlo y comitearlo en el mismo flujo sin conflictos de escritura.
#
# Origen de este archivo: es la reconstruccion del content-calendar.yaml
# original (creado en el commit b6169f4, borrado en 38e6fd3 al migrar a
# Sheets) mas las 11 filas de magnesio/resveratrol que el agente redactor ya
# habia publicado (ocultas en Shopify) el 2026-08-30/31 usando ese YAML
# original antes de que se borrara — la hoja de Sheets nunca reflejo ese
# trabajo. Los campos handle_final/article_gid/fecha_publicacion_oculta de
# esas 11 filas se verificaron contra la API de Shopify el 2026-09-01.
#
# Esquema de cada entrada en `articulos`:
#   tema                        - Titulo propuesto del articulo
#   cluster                     - id del cluster (ver bloque `clusters` abajo)
#   rol                         - pilar | cluster
#   keyword_objetivo            - keyword principal (ver reglas A4 del playbook)
#   keywords_secundarias        - lista de keywords secundarias
#   estado                      - idea | publicado | qa_fallido | canibalizacion_detectada
#   handle_propuesto            - slug sugerido antes de publicar
#   handle_final                - slug real devuelto por Shopify al publicar
#   article_gid                 - gid://shopify/Article/... devuelto al publicar
#   fecha_publicacion_oculta    - fecha en que se creo el articulo oculto en Shopify
#   faq_jsonld_pendiente_de_pegar - ruta a un .html con el <script type="application/ld+json">
#                                   del FAQPage, listo para pegar a mano en el tema de Shopify
#                                   (nunca en el bodyHtml: Shopify lo borra al re-guardar)
#   enlaces_internos_obligatorios - enlaces que el Paso 3 del playbook debe resolver en vivo
#   nota                         - contexto libre para el agente o para revision humana
#
# IMPORTANTE — regla de oro que NO cumplieron 2 de las 11 filas recuperadas:
# los articulos deben crearse SIEMPRE con isPublished: false (oculto). Dos
# filas (los pilares de magnesio y resveratrol) quedaron isPublished: true
# (visibles al publico) sin pasar por revision humana — quedan marcadas con
# su propia `nota` mas abajo. Pendiente de decision manual.

clusters:
  - id: hongos-adaptogenos
    nombre: Hongos adaptogenos y funcionales (melena de leon)
    tipo: B2C
    prioridad: alta
    nota: >
      Eje 100% libre, cero articulos existentes. Competencia directa identificada: Bloommart ya
      publico una guia pilar ("Hongos Funcionales: Que Son, Para Que Sirven y Cual Elegir en
      Colombia, Guia 2026") en su propio blog "noticias" — hay que superarla en profundidad y usar
      la ventaja real de catalogo (linea Lion Factor + linea Natalia Paris, 3 presentaciones:
      batido, masticables, gotero).
    coleccion_sugerida: hongos-funcionales (pendiente crear, confirmar con Julian)
  - id: monk-fruit
    nombre: Monk fruit / fruto del monje
    tipo: B2C
    prioridad: alta
    nota: >
      Eje libre. 2 productos activos en catalogo (gotero y polvo). Enlazar con el articulo existente
      "Stevia vs. azucar vs. otros edulcorantes" (ya publicado) en vez de duplicarlo — monk fruit se
      posiciona como complemento/alternativa, no como remake de ese articulo.
  - id: productos-naturales-colombia
    nombre: Productos naturales en Colombia (hub B2C)
    tipo: B2C
    prioridad: media
    nota: >
      Pilar amplio de categoria, alta competencia de keyword. Su funcion principal es ser el hub que
      enlaza hacia colageno, endulzantes, hongos adaptogenos y chai — corrige el defecto #1 del
      diagnostico original (cero enlaces internos). Cuerpo del articulo mas corto que los pilares de
      producto porque su valor es el enlazado, no la profundidad.
  - id: maquila-b2b
    nombre: Maquila y marca propia — angulos no cubiertos por la agencia
    tipo: B2B
    prioridad: alta
    nota: >
      Kick Ranking (agencia SEO contratada) ya publico/dejo en borrador contenido de "como crear tu
      marca" y "que formatos de maquila existen". Este cluster cubre SOLO angulos que ellos no
      tocaron: comparativa de laboratorios, distincion marca propia vs. marca blanca, nicho
      dropshippers, cumplimiento INVIMA, costos/MOQ. Enlazar con el articulo pilar existente
      "Servicios de maquila y otros Vitaliah Labs". CERRADO por ahora (6/6 completo) — no sumar mas
      temas de maquila hasta ver si Kick Ranking publica sus 3 borradores pendientes ("Proceso de
      maquila...", "Que productos puedes fabricar...", "Maquila de suplementos en polvo, sachets,
      tabletas y liquidos: que formato elegir") para evitar solapamiento futuro.
  - id: linaza-masticables
    nombre: Linazas y masticables funcionales
    tipo: B2C
    prioridad: alta
    nota: >
      Eje libre: no se encontro ningun articulo dedicado a linaza en los ~95 articulos auditados
      (solo una mencion de paso en "Que suplementos anadir a tus batidos"). Catalogo real y
      profundo: coleccion "linazas" (11 productos: fibra linaza + chia/te verde/alcachofa/frutos
      rojos/pitaya-noni/flor de jamaica/pina, handle "linazas") y coleccion
      "masticables-funcionales" (9 productos).
    coleccion_sugerida: 'linazas (ya existe, handle: linazas)'
  - id: yogurt-griego
    nombre: Yogurt griego y batidos saludables
    tipo: B2C
    prioridad: media
    nota: >
      Eje libre: cero articulos dedicados a yogurt griego encontrados (el cluster de "batidos" esta
      saturado en general, pero yogurt griego especificamente no se toco). Catalogo real: coleccion
      "yogurt-griego" (3 productos: Yogurt Griego 500g, 250g, y Colageno con Yogurt Griego 540g —
      este ultimo cruza con el cluster de colageno, ya saturado, asi que el angulo debe ser "yogurt
      griego" primero, colageno despues).
    coleccion_sugerida: 'yogurt-griego (ya existe, handle: yogurt-griego)'
  - id: magnesio
    nombre: Magnesio (sueno, estres, calambres)
    tipo: B2C
    prioridad: alta
    nota: >
      Eje libre para la rutina diaria de octubre: cero articulos existentes sobre magnesio en los
      113 articulos auditados. Catalogo real: Masticables Mag Fussion (120 und) y Bebida Herbal Mag
      Fussion (400g), en las colecciones "relajacion-y-bienestar-emocional" y "balance-nutritivo".
      Alto volumen de busqueda esperado (sueno, estres, calambres, ansiedad).
    coleccion_sugerida: relajacion-y-bienestar-emocional (ya existe)
  - id: resveratrol
    nombre: Resveratrol (antioxidante, antienvejecimiento)
    tipo: B2C
    prioridad: media
    nota: >
      Eje libre: cero articulos existentes. Catalogo real: Batido con Resveratrol 500g y Masticables
