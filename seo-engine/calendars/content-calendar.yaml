    tipo: B2C
    prioridad: alta
    nota: >
      Eje libre: cero articulos existentes, tema de muy alto volumen de busqueda en fitness.
      Catalogo real: Batido Crea 10 - Creatina 400g, coleccion "balance-nutritivo". Un solo producto
      en catalogo -- enlazar el 3er enlace obligatorio de cada subtema al hub "Productos naturales
      en Colombia" o al articulo existente "Batidos de proteina vs. batidos de frutas" en vez de
      forzar un segundo producto que no existe.
    coleccion_sugerida: balance-nutritivo (ya existe)
  - id: proteina-vegana
    nombre: Proteina vegana (nicho vegano/fitness)
    tipo: B2C
    prioridad: media
    nota: >
      Eje libre: los articulos de "batidos de proteina" existentes no tocan especificamente la
