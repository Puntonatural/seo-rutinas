# ANTES de pasarle el brief al redactor -- asi lib/writer.js nunca tiene
# que adivinar un slug de producto/coleccion.
#
# Cada entrada: una o mas "aliases" (texto que puede aparecer en la
# descripcion del calendario) -> la URL real.

